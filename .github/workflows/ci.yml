name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: fmt
        run: forge fmt --check
      - name: build
        run: forge build
      - name: test
        run: forge test

  tee:
    name: tee (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tee/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: tee/go/go.sum
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  web:
    name: web (next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build

  backend:
    name: backend (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: install
        run: npm ci
      - name: syntax
        run: |
          for f in *.mjs; do node --check "$f"; done
      - name: test
        run: node --test
